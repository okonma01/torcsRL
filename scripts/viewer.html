<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TORCS race viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151c; color: #edf1f6; font: 15px system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #354052; flex-wrap: wrap; }
    h1 { margin: 0 16px 0 0; font-size: 18px; }
    button { padding: 9px 15px; border: 1px solid #566780; border-radius: 6px; background: #253348; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #354b69; }
    button:disabled { opacity: .5; cursor: wait; }
    #state { margin-left: auto; color: #c0ccdb; }
    #stage { position: relative; height: calc(100dvh - 120px); min-height: 280px; background: #000; }
    #stage:fullscreen { height: 100dvh; }
    #screen { width: 100%; height: 100%; }
    #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 30px; background: #111820; }
    #empty[hidden] { display: none; }
    #empty h2 { font-size: 24px; margin: 0 0 12px; }
    #empty p { max-width: 580px; line-height: 1.6; color: #bfcad9; margin: 0; }
    footer { padding: 10px 20px; font-size: 13px; color: #bfcad9; }
    #message { color: #ffbda5; }
  </style>
</head>
<body>
  <header>
    <h1>TORCS race viewer</h1>
    <button id="start">Start demo</button>
    <button id="stop">Stop demo</button>
    <button id="full">Full screen</button>
    <span id="state" role="status">Connecting to the simulator...</span>
  </header>
  <main id="stage">
    <div id="screen"></div>
    <div id="empty">
      <h2 id="empty-title">Connecting to TORCS</h2>
      <p id="empty-text">The race will appear here. Use Full screen to enlarge the view.</p>
    </div>
  </main>
  <footer>
    Demo: a simple driving controller, running until you press Stop demo. To watch MPS training, stop the demo and run training with <code>--render</code>.
    <span id="message" role="alert"></span>
  </footer>
  <script type="module">
    import RFB from '/novnc/core/rfb.js';
    const byId = id => document.getElementById(id);
    const screen = byId('screen');
    const rfb = new RFB(screen, `ws://${location.hostname}:6080/websockify`);
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.viewOnly = false;
    let connected = false;
    rfb.addEventListener('connect', () => { connected = true; });
    rfb.addEventListener('disconnect', () => {
      connected = false;
      byId('empty').hidden = false;
      byId('empty-title').textContent = 'Viewer disconnected';
      byId('empty-text').textContent = 'Reload this page after starting the simulator desktop.';
    });
    async function refresh() {
      try {
        const response = await fetch('/status');
        if (!response.ok) throw new Error('Simulator status is unavailable');
        const status = await response.json();
        const race = status.races.find(r => r.visible && r.running);
        byId('state').textContent = race ? `Live race: ${race.track}` : status.demo_running ? 'Starting demo...' : 'No race running';
        byId('empty').hidden = connected && Boolean(race);
        if (!race) {
          byId('empty-title').textContent = status.demo_running ? 'Starting the race' : 'Ready to race';
          byId('empty-text').textContent = status.error || 'Press Start demo to watch the car and track. The demo keeps running until you stop it.';
        }
        byId('start').disabled = status.demo_running || Boolean(race);
        byId('stop').disabled = !status.demo_running;
      } catch (error) {
        byId('state').textContent = 'Simulator unavailable';
        byId('message').textContent = error.message;
      }
    }
    async function control(operation) {
      byId('message').textContent = '';
      byId('start').disabled = true;
      byId('stop').disabled = true;
      try {
        const response = await fetch(`/${operation}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
      } catch (error) {
        byId('message').textContent = error.message;
      }
      await refresh();
    }
    byId('start').onclick = () => control('demo-start');
    byId('stop').onclick = () => control('demo-stop');
    byId('full').onclick = async () => {
      try {
        await byId('stage').requestFullscreen();
      } catch (error) {
        byId('message').textContent = `Could not enter full screen: ${error.message}`;
      }
    };
    await refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
